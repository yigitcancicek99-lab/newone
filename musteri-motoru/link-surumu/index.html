  if (!t) return "";
  let r = String(t).replace(/\D/g, "");
  if (r.startsWith("0090")) r = r.slice(4); else if (r.startsWith("90") && r.length === 12) r = r.slice(2); else if (r.startsWith("0") && r.length === 11) r = r.slice(1);
  if (r.length === 10 && "2345".includes(r[0])) return `+90 ${r.slice(0, 3)} ${r.slice(3, 6)} ${r.slice(6, 8)} ${r.slice(8)}`;
  return String(t).trim();
}
const alanAdi = (w) => { try { return new URL(/^https?:/.test(w) ? w : "http://" + w).hostname.replace(/^www\./, ""); } catch { return ""; } };
function tarihNormal(m) {
  m = String(m || "").trim();
  const a = m.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/);
  if (a) return `${a[3]}-${a[2].padStart(2, "0")}-${a[1].padStart(2, "0")}`;
  return /^\d{4}-\d{2}-\d{2}/.test(m) ? m.slice(0, 10) : m;
}

// ---------- Puanlama (0–100): sinyal 30 + tazelik 20 + sektör 20 + konum 10 + büyüklük/unvan 10 + iletişim 10 ----------
function eslesir(deger, hedefler) {
  const d = sade(deger); if (!d) return false;
  return hedefler.some((h) => { h = sade(h); return h && (d.includes(h) || h.includes(d)); });
}
function puanla(l, p) {
  if (["uygun_degil", "kaybedildi"].includes(l.durum)) return { puan: 0, oncelik: "–", detay: {} };
  const sin = (p.sinyaller || []).find((s) => s.kod === l.sinyal);
  let sp = 0, taz = 0;
  if (sin) {
    sp = Math.max(0, Math.min(30, Number(sin.agirlik) || 0));
    const t = Date.parse(l.sinyal_tarihi);
    taz = isNaN(t) ? 4 : 20 * Math.pow(0.5, Math.max(0, (Date.now() - t) / 864e5) / Math.max(1, Number(sin.yari_omur) || 90));
  }
  const hs = p.hedef_sektorler || [], hc = p.hedef_sehirler || [], hb = p.hedef_buyuklukler || [], hu = p.hedef_unvanlar || [];
  const sektor = !hs.length ? 10 : eslesir(l.sektor, hs) ? 20 : 4;
  const konum = !hc.length ? 5 : eslesir(`${l.sehir || ""} ${l.ilce || ""}`, hc) ? 10 : 2;
  const buy = !hb.length || !l.buyukluk ? 2.5 : hb.includes(l.buyukluk) ? 5 : 0;
  const unv = !hu.length || !l.unvan ? 2.5 : eslesir(l.unvan, hu) ? 5 : 1;
  const ks = l.kisiler || [];
  const il = (l.telefon || l.telefon2 || l.whatsapp ? 5 : 0) + (l.eposta || ks.some((k) => k.eposta) ? 3 : 0) + (l.yetkili || ks.length ? 2 : 0);
  const puan = Math.round((sp + taz + sektor + konum + buy + unv + il) * 10) / 10;
  const oncelik = puan >= (p.esik_a ?? 70) ? "A" : puan >= (p.esik_b ?? 50) ? "B" : "C";
  return { puan, oncelik, detay: { sinyal: sp, tazelik: Math.round(taz * 10) / 10, sektor, konum, "büyüklük/unvan": buy + unv, iletisim: il } };
}
const iletisimeUygun = (l, p) => (p.satis_tipi === "b2c" ? l.izin === "acik_riza" : l.izin !== "yok");

}
function dbHataMesaji(err) {

async function analizEt() {
  if (!D.sample) return yzYok();
  const b = $("#analizBtn"); b.disabled = true; b.textContent = "Analiz ediliyor (30–90 sn)…";
  try {
    const cevap = Object.fromEntries(new FormData($("#mulakatForm")));
    await projeKaydet({ mulakat: cevap });
    const satirlar = [];
    for (const [bolum, q] of MULAKAT) for (const [k, s] of q) if ((cevap[k] || "").trim()) satirlar.push(`[${bolum}] ${s}\nCevap: ${cevap[k]}`);
    if (cevap.serbest_notlar?.trim()) satirlar.push(`[Görüşme notları]\n${cevap.serbest_notlar}`);

function mukerrerBul(l) {

async function topluEkle(liste) {
  const sonuc = { eklenen: 0, mukerrer: 0, hatali: 0 };
  const yerel = [...D.leadler];
  for (const ham of liste) {
    const l = leadTemizle(ham);
    if (!l.ad) { sonuc.hatali++; continue; }
    const onceki = D.leadler; D.leadler = yerel; const m = mukerrerBul(l); D.leadler = onceki;
    try {
      if (m) {
        const eksik = Object.fromEntries(Object.entries(l).filter(([k, v]) => v && !m[k] && k !== "kisiler"));
        if (l.kisiler?.length) { const b = kisileriBirlestir(m.kisiler, l.kisiler); if (JSON.stringify(b) !== JSON.stringify(m.kisiler || [])) { eksik.kisiler = b; m.kisiler = b; } }
        if (Object.keys(eksik).length) await dbYaz(() => leadKoleksiyonu(D.proje.id).doc(m.id).update({ ...eksik, guncelleme: new Date().toISOString() }));
        sonuc.mukerrer++;
      } else {
        const id = yeniId(), kayit = { durum: "yeni", izin: "bilinmiyor", ...l, olusturma: new Date().toISOString() };
        await dbYaz(() => leadKoleksiyonu(D.proje.id).doc(id).set(kayit));
        yerel.push({ id, ...kayit }); sonuc.eklenen++;
      }
    } catch (err) { sonuc.hatali++; if (err?.code === "quota_exceeded") { bildir(dbHataMesaji(err), true); break; } }
  }
  return sonuc;
}
const LEAD_ALANLARI = ["ad", "tur", "sektor", "sehir", "ilce", "adres", "buyukluk", "web", "telefon", "telefon2", "eposta", "linkedin", "instagram",
  "whatsapp", "facebook", "x", "iletisim_formu", "yetkili", "unvan",
  "sinyal", "sinyal_ozet", "sinyal_tarihi", "kaynak", "kaynak_turu", "izin", "durum", "sonraki_adim", "sonraki_tarih", "notlar"];
function leadTemizle(v) {
  const l = {};
  for (const k of LEAD_ALANLARI) if (v[k] != null && String(v[k]).trim() !== "") l[k] = String(v[k]).trim().slice(0, 4000);
  if (l.telefon) l.telefon = telefonNormal(l.telefon);
  if (l.telefon2) l.telefon2 = telefonNormal(l.telefon2);
  if (l.eposta) l.eposta = l.eposta.toLowerCase();
  if (l.sinyal_tarihi) l.sinyal_tarihi = tarihNormal(l.sinyal_tarihi);
  if (l.sonraki_tarih) l.sonraki_tarih = tarihNormal(l.sonraki_tarih);
  if (l.whatsapp) l.whatsapp = telefonNormal((l.whatsapp.match(/(?:wa\.me\/|phone=)\+?(\d{10,15})/) || [])[1] || l.whatsapp);
  if (l.linkedin) l.linkedin = linkedinNormal(l.linkedin);
  if (Array.isArray(v.kisiler)) l.kisiler = kisileriTemizle(v.kisiler);
  return l;
}
function linkedinNormal(u) {
  u = String(u || "").trim(); if (!u || !/linkedin\.com/i.test(u)) return u;
  try { const x = new URL(/^https?:/i.test(u) ? u : "https://" + u); return "https://www.linkedin.com" + x.pathname.replace(/\/+$/, ""); } catch { return u; }
}
function kisileriTemizle(liste) {
  return (liste || []).map((k) => {
    if (!k || typeof k !== "object") return null;
    const t = {}; for (const a of ["ad", "unvan", "rol", "linkedin", "eposta", "telefon", "kaynak", "not"]) t[a] = String(k[a] ?? "").trim().slice(0, 500);
    if (!t.ad && !t.linkedin && !t.eposta) return null;
    t.linkedin = linkedinNormal(t.linkedin); t.telefon = telefonNormal(t.telefon); t.eposta = t.eposta.toLowerCase();
    if (!KISI_ROLLERI[t.rol]) t.rol = t.rol ? "diger" : "karar_verici";
    return t;
  }).filter(Boolean).slice(0, 40);
}
const kisiAnahtari = (k) => k.linkedin || k.eposta || sade(k.ad);
function kisileriBirlestir(eski, yeni) {
  const sonuc = (eski || []).map((k) => ({ ...k }));
  for (const k of kisileriTemizle(yeni)) {
    const m = sonuc.find((x) => kisiAnahtari(x) === kisiAnahtari(k) || (k.ad && sade(x.ad) === sade(k.ad)));
    if (m) { for (const [a, v] of Object.entries(k)) if (v && !m[a]) m[a] = v; } else sonuc.push(k);
  }
  return sonuc;
}

function dialogAc(html) {
  dialogKapat();
  const arka = document.createElement("div"); arka.className = "dialog-arka"; arka.id = "dialog";
  arka.innerHTML = `<div class="dialog" role="dialog" aria-modal="true">${html}</div>`;
  arka.onclick = (ev) => { if (ev.target === arka) dialogKapat(); };
  document.body.append(arka);
  document.addEventListener("keydown", escKapat);
  return arka;
}
function escKapat(ev) { if (ev.key === "Escape") dialogKapat(); }
function dialogKapat() { $("#dialog")?.remove(); document.removeEventListener("keydown", escKapat); }

async function mesajYaz(l) {

  const kutu = $("#mesajKutu"), b = $("#mesajBtn"); b.disabled = true; kutu.className = "mesaj"; kutu.textContent = "Yazılıyor…";

      `Hedef kayıt: ${l.ad}${l.sektor ? ", " + l.sektor : ""}${l.sehir ? ", " + l.sehir : ""}. Yetkili: ${l.yetkili || "-"} ${l.unvan ? "(" + l.unvan + ")" : ""}.\n` +
      `Sinyal: ${sinyalAdi(l.sinyal) || "yok"} – ${l.sinyal_ozet || ""} ${l.sinyal_tarihi || ""}\nNotlar: ${(l.notlar || "").slice(0, 800)}\n\n` +
      `Bu kişiye üç kısa taslak yaz: 1) E-posta (konu satırı + en fazla 90 kelime), 2) LinkedIn bağlantı notu (en fazla 280 karakter), 3) Telefon açılış cümlesi (2-3 cümle). ` +
      `Sinyale doğal biçimde atıf yap, satış kokmasın, tek bir net sonraki adım öner. Yer tutucu olarak yalnızca [Adınız] kullan. Başlıkları sade yaz, Markdown kullanma.`,
      { modelTier: "default", cache: false, onText: ({ text }) => { kutu.textContent = text; } });
    const kopya = document.createElement("button"); kopya.type = "button"; kopya.className = "btn kucuk"; kopya.textContent = "Kopyala"; kopya.style.marginTop = "8px";
    kopya.onclick = () => navigator.clipboard?.writeText(kutu.firstChild?.textContent || kutu.textContent).then(() => bildir("Kopyalandı"), () => bildir("Kopyalanamadı; metni seçip kopyalayın.", true));
    kutu.after(kopya);
  } catch (err) { kutu.textContent = ""; yzHata(err); }
  finally { b.disabled = false; }
}

// ---------- Kişiler ve kanallar ----------
function kanalOzet(l) {
  const k = l.kisiler || [], parca = [];
  if (k.length) parca.push(`${k.length} kişi${k.some((x) => x.linkedin) ? " · LinkedIn" : ""}`);
  for (const [a, t] of [["whatsapp", "WhatsApp"], ["iletisim_formu", "form"], ["linkedin", "şirket sayfası"]]) if (l[a]) parca.push(t);
  return parca.length ? `<div><span class="etiket">${e(parca.join(" · "))}</span></div>` : "";
}
function kanalLinkleri(l) {
  const enc = encodeURIComponent, ham = (t) => String(t || "").replace(/\D/g, "");
  const metin = [l.telefon && `Tel: ${l.telefon}`, l.telefon2 && `Tel 2: ${l.telefon2}`, l.eposta && `E-posta: ${l.eposta}`].filter(Boolean);
  const k = [];
  if (l.whatsapp) k.push([`https://wa.me/${ham(l.whatsapp)}`, "WhatsApp'tan yaz"]);
  if (l.iletisim_formu) k.push([l.iletisim_formu, "İletişim formu"]);
  if (l.web) k.push([/^https?:/.test(l.web) ? l.web : "https://" + l.web, "Web sitesi"]);
  if (l.linkedin) k.push([l.linkedin, "LinkedIn sayfası"]);
  if (l.instagram) k.push([/^https?:/.test(l.instagram) ? l.instagram : `https://instagram.com/${l.instagram.replace(/^@/, "")}`, "Instagram"]);
  if (l.facebook) k.push([l.facebook, "Facebook"]);
  if (l.x) k.push([l.x, "X"]);
  k.push([`https://www.google.com/maps/search/${enc(`${l.ad} ${l.sehir || ""}`)}`, "Haritada bul"]);
  return `${metin.length ? `<div class="k" style="user-select:all;margin-bottom:6px">${e(metin.join(" · "))}</div>` : ""}
    <div class="yatay">${k.map(([h, t]) => `<a class="btn kucuk" href="${e(h)}" target="_blank" rel="noopener">${e(t)}</a>`).join("")}</div>`;
}
function linkedinAramalari(firma, unvanlar) {
  const enc = encodeURIComponent, hedef = [...new Set((unvanlar || []).filter(Boolean))].slice(0, 8);
  const lnk = (q) => `https://www.linkedin.com/search/results/people/?keywords=${enc(q)}`;
  const xray = (u) => `https://www.google.com/search?q=${enc(`site:linkedin.com/in "${firma}"${u ? ` "${u}"` : ""}`)}`;
  return `<div class="yatay" style="align-items:center"><span class="k">LinkedIn'de çalışan ara:</span>
      <a class="btn kucuk" target="_blank" rel="noopener" href="${e(lnk(firma))}">Tüm çalışanlar</a>
      ${hedef.map((u) => `<a class="btn kucuk" target="_blank" rel="noopener" href="${e(lnk(firma + " " + u))}">${e(u)}</a>`).join("")}</div>
    <div class="yatay" style="align-items:center;margin-top:6px"><span class="k">Google'da profil ara:</span>
      ${(hedef.length ? hedef : [""]).map((u) => `<a class="btn kucuk" target="_blank" rel="noopener" href="${e(xray(u))}">${e(u || "Tüm profiller")}</a>`).join("")}</div>

}

  ad: ["ad", "firma", "firma adi", "sirket", "sirket adi", "isletme", "company", "company name", "name", "ad soyad", "musteri", "kurum", "unvan firma"],

  telefon2: ["telefon 2", "telefon2", "tel 2", "cep telefonu"], eposta: ["eposta", "e posta", "email", "e mail", "mail", "e posta adresi"],
  linkedin: ["linkedin"], instagram: ["instagram"], whatsapp: ["whatsapp", "wp"], facebook: ["facebook"], x: ["x", "twitter"],
  iletisim_formu: ["iletisim formu", "contact form"], yetkili: ["yetkili", "yetkili kisi", "ilgili kisi", "contact", "contact name", "kisi", "hedef kisi"],
  unvan: ["unvan", "pozisyon", "gorev", "job title", "position", "hedef unvan"], sinyal: ["sinyal", "sinyal turu"], sinyal_ozet: ["sinyal ozeti", "olay", "aciklama"],
  sinyal_tarihi: ["sinyal tarihi", "olay tarihi", "tarih", "date"], kaynak: ["kaynak", "source"], izin: ["izin", "riza", "acik riza"], durum: ["durum", "status"], notlar: ["notlar", "not", "notes"],
};
function csvCoz(metin) {
  metin = metin.replace(/^\ufeff/, "");
  const ilk = metin.split(/\r?\n/, 1)[0];
  const ayr = [",", ";", "\t"].sort((a, b) => ilk.split(b).length - ilk.split(a).length)[0];
  const satirlar = []; let satir = [], hucre = "", tirnak = false;
  for (let i = 0; i < metin.length; i++) {
    const c = metin[i];
    if (tirnak) { if (c === '"') { if (metin[i + 1] === '"') { hucre += '"'; i++; } else tirnak = false; } else hucre += c; }
    else if (c === '"') tirnak = true;
    else if (c === ayr) { satir.push(hucre); hucre = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && metin[i + 1] === "\n") i++; satir.push(hucre); hucre = ""; satirlar.push(satir); satir = []; }
    else hucre += c;
  }
  if (hucre || satir.length) { satir.push(hucre); satirlar.push(satir); }
  const dolu = satirlar.filter((s) => s.some((h) => h.trim()));
  if (!dolu.length) return { liste: [], esleme: {}, eslesmeyen: [] };
  const bas = dolu[0], esleme = {}, kullanilan = new Set();
  bas.forEach((b, i) => { const bs = sade(b); for (const [alan, es] of Object.entries(BASLIK)) if (!kullanilan.has(alan) && (es.includes(bs) || bs === alan)) { esleme[i] = alan; kullanilan.add(alan); break; } });
  const eslesmeyen = bas.filter((b, i) => !(i in esleme) && b.trim());
  const liste = dolu.slice(1).map((s) => {
    const l = {}, ek = [];
    s.forEach((h, i) => { if (i in esleme) l[esleme[i]] = h; else if (h.trim() && bas[i]?.trim()) ek.push(`${bas[i].trim()}: ${h.trim()}`); });
    if (ek.length) l.notlar = [l.notlar, ...ek].filter(Boolean).join("; ");
    l.kaynak_turu = "csv"; return l;
  });
  return { liste, esleme: Object.fromEntries(Object.entries(esleme).map(([i, a]) => [bas[i], a])), eslesmeyen };
}

async function csvIndir() {
  if (!D.indir) return bildir("Dosya indirme bu görünümde kullanılamıyor.", true);

  const deger = (l, k) => {

  };
  const csv = "\ufeff" + [DISA.map(([, b]) => b).join(";"), ...L.map((l) => DISA.map(([k]) => h(deger(l, k))).join(";"))].join("\r\n");
  try { await D.indir.save({ filename: `${sade(D.proje.ad).replace(/ /g, "-") || "liste"}-${bugunISO()}.csv`, data: new Blob([csv], { type: "text/csv;charset=utf-8" }) }); }

}

      <label for="a-tur">Ne satılıyor<select id="a-tur" name="teklif_turu">${secenek({ urun: "Ürün", hizmet: "Hizmet" }, p.teklif_turu)}</select></label>
      <label class="tam" for="a-teklif">Ürün / hizmet açıklaması<input id="a-teklif" name="teklif" value="${e(p.teklif || "")}"></label></div></div>
    <div class="kart"><h2>İdeal müşteri profili</h2><p class="aciklama">Kayıtlar bu hedeflere uydukça puan alır. Boş bırakılan hedef puanı etkilemez.</p><div class="izgara">
      <label class="tam" for="a-sek">Hedef sektörler / segmentler (virgülle)<input id="a-sek" name="hedef_sektorler" value="${e(listeMetni(p.hedef_sektorler))}"></label>
      <label class="tam" for="a-seh">Hedef şehir / ilçeler (virgülle)<input id="a-seh" name="hedef_sehirler" value="${e(listeMetni(p.hedef_sehirler))}"></label>
      <label class="tam" for="a-unv">Hedef unvanlar (virgülle)<input id="a-unv" name="hedef_unvanlar" value="${e(listeMetni(p.hedef_unvanlar))}"></label>
      <div class="tam"><span class="k">Hedef firma büyüklüğü</span><div class="secenekler">${Object.entries(BUYUKLUK).map(([k, v]) => `<label><input type="checkbox" name="b_${k}" ${(p.hedef_buyuklukler || []).includes(k) ? "checked" : ""}> ${e(v)}</label>`).join("")}</div></div>
      <label for="a-ea">A eşiği<input id="a-ea" name="esik_a" type="number" min="0" max="100" value="${p.esik_a ?? 70}"></label>
      <label for="a-eb">B eşiği<input id="a-eb" name="esik_b" type="number" min="0" max="100" value="${p.esik_b ?? 50}"></label></div></div>
    <div class="kart"><h2>Satın alma sinyalleri</h2><p class="aciklama"><b>Ağırlık</b> (0–30): sinyalin satın almayı ne kadar güçlü gösterdiği. <b>Yarı ömür</b> (gün): değerinin kaç günde yarıya indiği.</p>
      <div id="sinyaller">${(p.sinyaller || []).map(sinyalSatiri).join("")}</div>
      <button type="button" class="btn kucuk" id="sinyalEkle">+ Sinyal ekle</button></div>
    <div class="satir" style="justify-content:space-between;margin-bottom:20px"><button type="button" class="btn tehlike" id="projeSil">Projeyi sil</button><button class="btn birincil" type="submit">Ayarları kaydet</button></div>
  </form>`;
  const bagla = () => $$("#sinyaller .sil").forEach((b) => (b.onclick = () => b.closest(".sinyal-satir").remove()));
  bagla();
  $("#sinyalEkle").onclick = () => { $("#sinyaller").insertAdjacentHTML("beforeend", sinyalSatiri({ kod: "", ad: "", agirlik: 15, yari_omur: 90 })); bagla(); };
  const sil = $("#projeSil");
  sil.onclick = async () => {
    if (sil.dataset.onay !== "1") { sil.dataset.onay = "1"; sil.textContent = `Proje ve ${D.leadler.length} kayıt silinsin mi? Tekrar tıklayın`; return; }
    sil.disabled = true;
    try {
      for (const l of D.leadler) await dbYaz(() => leadKoleksiyonu(p.id).doc(l.id).delete());
      if (D.dinleLeadler) { D.dinleLeadler(); D.dinleLeadler = null; }
      await dbYaz(() => projeKoleksiyonu().doc(p.id).delete());
      D.proje = null; D.sekme = "pano"; bildir("Proje silindi");
    } catch (err) { bildir(dbHataMesaji(err), true); sil.disabled = false; }
  };
  $("#ayarForm").onsubmit = async (ev) => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    const sinyaller = $$("#sinyaller .sinyal-satir").map((r) => { const [kod, ad, ag, yo] = $$("input", r).map((i) => i.value.trim());
      return { kod: kod || sade(ad).replace(/ /g, "_"), ad: ad || kod, agirlik: Math.max(0, Math.min(30, Number(ag) || 0)), yari_omur: Math.max(1, Number(yo) || 90) }; }).filter((s) => s.kod);
    try {
      await projeKaydet({ ad: f.get("ad").trim(), musteri: f.get("musteri").trim(), satis_tipi: f.get("satis_tipi"), teklif_turu: f.get("teklif_turu"), teklif: f.get("teklif").trim(),
        hedef_sektorler: virgulListe(f.get("hedef_sektorler")), hedef_sehirler: virgulListe(f.get("hedef_sehirler")), hedef_unvanlar: virgulListe(f.get("hedef_unvanlar")),
        hedef_buyuklukler: Object.keys(BUYUKLUK).filter((k) => f.get("b_" + k)), esik_a: Number(f.get("esik_a")) || 70, esik_b: Number(f.get("esik_b")) || 50, sinyaller });
      bildir("Kaydedildi; puanlar yeniden hesaplandı."); cerceveCiz();
    } catch { }
  };
}
const sinyalSatiri = (s) => `<div class="sinyal-satir"><input aria-label="Kod" value="${e(s.kod)}" placeholder="kod (otomatik)"><input aria-label="Ad" value="${e(s.ad)}" placeholder="ör. Yeni şube açtı">
  <input aria-label="Ağırlık" type="number" min="0" max="30" value="${s.agirlik}"><input aria-label="Yarı ömür (gün)" type="number" min="1" value="${s.yari_omur}"><button type="button" class="btn kucuk tehlike sil">Sil</button></div>`;

basla().catch((err) => bildir("Başlatılamadı: " + (err?.message || err), true));
</script>
